<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="gbr-badge-top-100-title gbr-badge-top-100-desc">
  <title id="gbr-badge-top-100-title">TOP 100 badge template</title>
  <desc id="gbr-badge-top-100-desc">An unissued Gatilab Blog Rankings badge template, clearly marked as not an award.</desc>
  <defs>
    <pattern id="gbr-badge-top-100-dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#d8cec5" opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="800" height="800" rx="96" fill="#0f0f0f"/>
  <rect x="48" y="48" width="704" height="704" rx="64" fill="none" stroke="#3f3f46" stroke-width="4"/>
  <g id="ranking-ladder" transform="translate(260 130) scale(1.15)">
<rect x="0" y="128" width="64" height="72" rx="8" fill="#e8836f"/>
<circle cx="32" cy="112" r="7" fill="#2f855a"/>
<rect x="88" y="80" width="64" height="120" rx="8" fill="#e8836f"/>
<circle cx="120" cy="64" r="7" fill="#2f855a"/>
<rect x="176" y="16" width="64" height="184" rx="8" fill="#e8836f"/>
<circle cx="208" cy="0" r="7" fill="#2f855a"/>
<path d="M32 112 L120 64 L208 0" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
  <text x="400" y="500" text-anchor="middle" font-family="'Google Sans Flex','Google Sans',system-ui,sans-serif" font-size="72" font-weight="700" fill="#fafafa">TOP 100</text>
  <text x="400" y="588" text-anchor="middle" font-family="'Google Sans Flex','Google Sans',system-ui,sans-serif" font-size="52" font-weight="600" fill="#e8836f">BADGE TEMPLATE</text>
  <text x="400" y="670" text-anchor="middle" font-family="'Google Sans Flex','Google Sans',system-ui,sans-serif" font-size="42" font-weight="400" fill="#a1a1aa">NOT AN ISSUED AWARD</text>
</svg>
