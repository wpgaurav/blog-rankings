<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="gbr-personal-finance-title gbr-personal-finance-desc">
  <title id="gbr-personal-finance-title">Personal Finance Blog Rankings</title>
  <desc id="gbr-personal-finance-desc">Gatilab category header for Personal Finance, showing separate Independent and Publisher and Company tracks and a public Top 100.</desc>
  <defs>
    <pattern id="gbr-personal-finance-dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#d8cec5" opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#faf7f2"/>
  <rect x="32" y="32" width="1536" height="836" rx="30" fill="url(#gbr-personal-finance-dots)" stroke="#d8cec5" stroke-width="2"/>
  <g id="category-copy">
    <text x="96" y="132" font-family="'Google Sans Flex','Google Sans',system-ui,sans-serif" font-size="54" font-weight="700" fill="#b94720">GATILAB BLOG RANKINGS</text>
    <text x="96" y="250" font-family="'Google Sans Flex','Google Sans',system-ui,sans-serif" font-size="90" font-weight="700" fill="#171717"><tspan x="96" dy="0">Personal Finance</tspan></text>
    <text x="96" y="390" font-family="'Google Sans Flex','Google Sans',system-ui,sans-serif" font-size="52" font-weight="400" fill="#4b5563"><tspan x="96" dy="0">Educational publishing about saving,</tspan><tspan x="96" dy="64">investing, debt, tax, financial</tspan><tspan x="96" dy="64">planning, and financial independence.</tspan></text>
    <path d="M96 632 H904" stroke="#cfc4ba" stroke-width="3"/>
    <text x="96" y="696" font-family="'Google Sans Flex','Google Sans',system-ui,sans-serif" font-size="48" font-weight="600" fill="#1f2937">Independent Blogs</text>
    <text x="96" y="758" font-family="'Google Sans Flex','Google Sans',system-ui,sans-serif" font-size="48" font-weight="600" fill="#1f2937">Publisher and Company Blogs</text>
    <text x="96" y="834" font-family="'Google Sans Flex','Google Sans',system-ui,sans-serif" font-size="48" font-weight="400" fill="#6b7280">Top 10 on Gatilab. Full Top 100 in GitHub.</text>
  </g>
  <g id="category-visual" transform="translate(1120 180)">
    <rect x="0" y="0" width="352" height="352" rx="26" fill="#ffffff" stroke="#d8cec5" stroke-width="2"/>
    <g id="category-symbol" transform="translate(110 70)"><path d="M8 112 L42 82 L70 94 L124 32" fill="none" stroke="#b94720" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M94 32 H124 V62" fill="none" stroke="#1f2937" stroke-width="8"/><path d="M8 126 H126" stroke="#1f2937" stroke-width="7"/></g>
    <path d="M76 260 H276" stroke="#d8cec5" stroke-width="3"/>
    <text x="176" y="326" text-anchor="middle" font-family="'Google Sans Flex','Google Sans',system-ui,sans-serif" font-size="54" font-weight="700" fill="#1f2937">TOP 100</text>
  </g>
  <g id="edition" transform="translate(1120 600)">
    <path d="M0 0 H352" stroke="#1f2937" stroke-width="3"/>
    <text x="0" y="74" font-family="'Google Sans Flex','Google Sans',system-ui,sans-serif" font-size="48" font-weight="600" fill="#b94720">MONTHLY EDITION</text>
    <text x="0" y="132" font-family="'Google Sans Flex','Google Sans',system-ui,sans-serif" font-size="48" font-weight="400" fill="#4b5563"><tspan x="0" dy="0">Public method</tspan><tspan x="0" dy="58">Open corrections</tspan></text>
  </g>
</svg>
